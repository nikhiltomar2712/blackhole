<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>Gargantua — Black Hole</title>
<style>
  :root { color-scheme: dark; }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
                 Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  #stage { position: fixed; inset: 0; }

  #scene {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: grab;
    outline: none;
  }
  #scene:active { cursor: grabbing; }

  /* ---------- HUD ---------- */
  .hud {
    position: fixed;
    left: clamp(18px, 4vw, 52px);
    top: clamp(18px, 5vh, 44px);
    pointer-events: none;
    user-select: none;
    z-index: 5;
  }
  .hud .title {
    font-size: clamp(11px, 1.3vw, 14px);
    font-weight: 600;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: rgba(255, 236, 216, 0.92);
    text-shadow: 0 0 24px rgba(255, 150, 60, 0.35);
  }
  .hud .sub {
    margin-top: 10px;
    font-size: clamp(9px, 0.85vw, 10px);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(255, 170, 110, 0.42);
  }

  .hint {
    position: fixed;
    left: 50%;
    bottom: clamp(18px, 4.5vh, 40px);
    transform: translateX(-50%);
    font-size: 10px;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.3);
    pointer-events: none;
    user-select: none;
    white-space: nowrap;
    z-index: 5;
    animation: hintPulse 5s ease-in-out infinite;
  }
  @keyframes hintPulse {
    0%, 100% { opacity: 0.35; }
    50%      { opacity: 0.85; }
  }

  .vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 3;
    background: radial-gradient(
      ellipse at 50% 50%,
      rgba(0,0,0,0) 42%,
      rgba(0,0,0,0.35) 78%,
      rgba(0,0,0,0.72) 100%
    );
  }

  /* ---------- Loader ---------- */
  #loader {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: grid;
    place-items: center;
    background: #000;
    color: rgba(255, 195, 140, 0.55);
    font-size: 10px;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    transition: opacity 0.9s ease;
  }
  #loader.hidden { opacity: 0; pointer-events: none; }

  @media (prefers-reduced-motion: reduce) {
    .hint { animation: none; }
  }
</style>
</head>
<body>

  <div id="stage">
    <canvas id="scene"></canvas>
  </div>

  <div class="hud">
    <div class="title">Gargantua</div>
    <div class="sub">Schwarzschild&nbsp;·&nbsp;rs = 1</div>
  </div>

  <div class="hint">Drag to orbit&nbsp;&nbsp;·&nbsp;&nbsp;Scroll to zoom</div>

  <div class="vignette"></div>
  <div id="loader">Initializing&nbsp;spacetime…</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
  import * as THREE from 'three';
  import { EffectComposer }   from 'three/addons/postprocessing/EffectComposer.js';
  import { ShaderPass }       from 'three/addons/postprocessing/ShaderPass.js';
  import { UnrealBloomPass }  from 'three/addons/postprocessing/UnrealBloomPass.js';
  import { OutputPass }       from 'three/addons/postprocessing/OutputPass.js';

  /* ============================================================
     1.  SHADERS
     ============================================================ */

  const VERTEX_SHADER = /* glsl */`
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 );
    }
  `;

  const FRAGMENT_SHADER = /* glsl */`
    uniform vec2  uResolution;
    uniform float uTime;
    uniform vec3  uCamPos;
    uniform mat3  uCamBasis;     // columns: right, up, forward
    uniform float uTanHalfFov;

    #define STEPS      150
    #define ESCAPE_R   70.0
    #define DISK_IN    2.40
    #define DISK_OUT   10.0
    #define PHOTON_R   1.50    // photon sphere radius (1.5 rs)

    /* ---------- hash / noise ---------- */

    float hash21(vec2 p) {
      p = fract(p * vec2(123.34, 456.21));
      p += dot(p, p + 45.32);
      return fract(p.x * p.y);
    }

    float hash31(vec3 p) {
      p = fract(p * 0.1031);
      p += dot(p, p.yzx + 33.33);
      return fract((p.x + p.y) * p.z);
    }

    float noise2(vec2 x) {
      vec2 i = floor(x);
      vec2 f = fract(x);
      f = f * f * (3.0 - 2.0 * f);
      float a = hash21(i);
      float b = hash21(i + vec2(1.0, 0.0));
      float c = hash21(i + vec2(0.0, 1.0));
      float d = hash21(i + vec2(1.0, 1.0));
      return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
    }

    float fbm2(vec2 p) {
      float s = 0.0;
      float a = 0.5;
      mat2 rot = mat2(0.80, 0.60, -0.60, 0.80) * 1.80;
      for (int i = 0; i < 4; i++) {
        s += a * noise2(p);
        p = rot * p;
        a *= 0.5;
      }
      return s;
    }

    /* ---------- star field ---------- */

    vec3 starLayer(vec3 dir, float scale, float thr, float sz, float bright) {
      vec3 p  = dir * scale;
      vec3 id = floor(p);
      vec3 f  = fract(p) - 0.5;

      float h = hash31(id);
      if (h < thr) return vec3(0.0);

      vec3 off = vec3(hash31(id + 11.7),
                      hash31(id + 27.3),
                      hash31(id + 51.1)) - 0.5;
      off *= 0.70;

      float d = length(f - off);
      float s = smoothstep(sz, 0.0, d);
      s *= s;

      float tw = 0.72 + 0.28 * sin(uTime * 1.7 + h * 87.0);
      return vec3(s * bright * tw);
    }

    vec3 starfield(vec3 dir) {
      vec3 c = vec3(0.0);
      c += starLayer(dir,  85.0, 0.940, 0.085, 1.00) * vec3(1.00, 0.96, 0.92);
      c += starLayer(dir, 150.0, 0.955, 0.070, 0.62) * vec3(0.78, 0.86, 1.00);
      c += starLayer(dir, 260.0, 0.965, 0.055, 0.34) * vec3(1.00, 0.86, 0.70);
      return c;
    }

    vec3 background(vec3 dir) {
      float n = fbm2(vec2(dir.x, dir.z) * 2.0 + dir.y * 1.5);
      vec3 haze = mix(vec3(0.0035, 0.0050, 0.0130),
                      vec3(0.0200, 0.0110, 0.0300), n);
      haze *= 0.55 + 0.45 * smoothstep(-0.7, 0.7, dir.y);
      return haze + starfield(dir);
    }

    /* ---------- accretion disk ---------- */

    vec3 diskSample(vec3 p, vec3 rd, float r) {
      // --- differential (Keplerian) rotation ---
      float phi   = atan(p.z, p.x);
      float omega = 1.70 / (r * sqrt(r));
      float ang   = phi + uTime * omega;

      vec2 q = vec2(cos(ang), sin(ang)) * r;

      // --- turbulent gas density ---
      float n = fbm2(q * 0.60);
      n = n * 0.78 + 0.22 * noise2(q * 3.10 + 7.0);
      n = pow(clamp(n * 1.45, 0.0, 1.0), 1.45);

      // --- radial envelope ---
      float rin  = smoothstep(DISK_IN, DISK_IN + 1.15, r);
      float rout = 1.0 - smoothstep(DISK_OUT * 0.45, DISK_OUT, r);
      float density = rin * rout * (0.24 + 1.05 * n);

      // --- temperature gradient: white-hot -> amber -> deep red ---
      float t = clamp((r - DISK_IN) / (DISK_OUT - DISK_IN), 0.0, 1.0);
      vec3 cHot  = vec3(1.00, 0.97, 0.92);
      vec3 cMid  = vec3(1.00, 0.58, 0.16);
      vec3 cCool = vec3(0.72, 0.12, 0.02);
      vec3 col = mix(cHot, cMid,  smoothstep(0.00, 0.28, t));
      col      = mix(col,  cCool, smoothstep(0.28, 1.00, t));

      // --- relativistic Doppler beaming ---
      vec3  vel = normalize(cross(p, vec3(0.0, 1.0, 0.0)));
      float mu  = dot(vel, -rd);
      float boost = pow(1.0 / (1.0 - 0.42 * clamp(mu, -0.99, 0.99)), 3.0);
      boost = clamp(boost, 0.30, 5.0);

      // --- optical path length through the slab ---
      float path = clamp(0.25 / max(abs(rd.y), 0.16), 0.45, 1.80);

      return col * density * boost * path * 2.0;
    }

    /* ---------- main ---------- */

    void main() {
      // ---- primary ray ----
      vec2 uv = (gl_FragCoord.xy * 2.0 - uResolution) / uResolution.y;
      vec3 rd = normalize(uCamBasis * vec3(uv * uTanHalfFov, 1.0));
      vec3 ro = uCamPos;

      // ---- conserved angular momentum of the geodesic ----
      vec3  hv = cross(ro, rd);
      float h2 = dot(hv, hv);
      float hm = sqrt(h2);

      vec3  pos = ro;
      vec3  dir = rd;
      vec3  col = vec3(0.0);
      float trans = 1.0;
      float minR = 1e9;
      bool  captured = false;

      // ---- integrate the null geodesic ----
      for (int i = 0; i < STEPS; i++) {
        float r = length(pos);
        minR = min(minR, r);

        if (r < 1.0) { captured = true; break; }               // crossed the horizon
        if (r > ESCAPE_R && dot(pos, dir) > 0.0) break;        // escaped to infinity

        // adaptive step: finer near the hole, coarser far away
        float dt = clamp(0.055 * r * r / (hm + 1.0), 0.012, 4.0);

        // Schwarzschild null-geodesic acceleration (rs = 1)
        float r2 = r * r;
        vec3  acc = -1.5 * h2 * pos / (r2 * r2 * r);

        vec3 npos = pos + dir * dt + 0.5 * acc * dt * dt;
        vec3 ndir = dir + acc * dt;

        // ---- analytic equatorial-plane crossing ----
        if (pos.y * npos.y < 0.0) {
          float f  = pos.y / (pos.y - npos.y);
          vec3  hit = mix(pos, npos, f);
          float rr  = length(hit.xz);

          if (rr > DISK_IN && rr < DISK_OUT) {
            vec3 e = diskSample(hit, normalize(dir), rr);
            col   += trans * e;
            trans *= 1.0 - clamp(dot(e, vec3(0.33)) * 0.55, 0.0, 0.75);
          }
        }

        pos = npos;
        dir = ndir;

        if (trans < 0.02) break;
      }

      vec3 outc = col;

      // ---- background sky (lensed) ----
      if (!captured) {
        outc += trans * background(normalize(dir));
      }

      // ---- subtle photon ring at the shadow edge ----
      float rq   = (minR - PHOTON_R) * 3.2;
      float ring = exp(-rq * rq);
      outc += vec3(1.0, 0.72, 0.42) * ring * 0.14;

      gl_FragColor = vec4(outc, 1.0);
    }
  `;

  /* ============================================================
     2.  RENDERER / SCENE
     ============================================================ */

  const stage  = document.getElementById('stage');
  const canvas = document.getElementById('scene');
  const loader = document.getElementById('loader');

  const renderer = new THREE.WebGLRenderer({
    canvas,
    antialias: false,
    alpha: false,
    stencil: false,
    powerPreference: 'high-performance'
  });
  renderer.setClearColor(0x000000, 1);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;

  // ---- initial quality guess based on pixel load ----
  const dprCap = Math.min(window.devicePixelRatio || 1, 1.5);
  const estPixels = window.innerWidth * window.innerHeight * dprCap * dprCap;
  let quality = estPixels > 2.2e6 ? 0.72 : 1.0;

  /* ============================================================
     3.  UNIFORMS + MATERIAL
     ============================================================ */

  const uniforms = {
    uResolution: { value: new THREE.Vector2(1, 1) },
    uTime:       { value: 0 },
    uCamPos:     { value: new THREE.Vector3(0, 5, 24) },
    uCamBasis:   { value: new THREE.Matrix3() },
    uTanHalfFov: { value: Math.tan(THREE.MathUtils.degToRad(45.0) * 0.5) }
  };

  const rayMaterial = new THREE.ShaderMaterial({
    uniforms,
    vertexShader:   VERTEX_SHADER,
    fragmentShader: FRAGMENT_SHADER,
    depthTest:  false,
    depthWrite: false,
    blending:   THREE.NoBlending
  });

  /* ============================================================
     4.  POST-PROCESSING
     ============================================================ */

  const composer = new EffectComposer(renderer);

  const rayPass = new ShaderPass(rayMaterial);
  composer.addPass(rayPass);

  const bloomPass = new UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    0.78,   // strength
    0.72,   // radius
    0.62    // threshold
  );
  composer.addPass(bloomPass);

  composer.addPass(new OutputPass());

  /* ============================================================
     5.  CAMERA ORBIT (custom, smoothed, inertial)
     ============================================================ */

  const orbit = {
    theta: 0.55,  phi: 1.36,  radius: 26,
    tTheta: 0.55, tPhi: 1.36, tRadius: 26,
    minPhi: 0.25, maxPhi: Math.PI - 0.25,
    minRadius: 9, maxRadius: 62
  };

  const camPos  = new THREE.Vector3();
  const forward = new THREE.Vector3();
  const right   = new THREE.Vector3();
  const up      = new THREE.Vector3();
  const worldUp = new THREE.Vector3(0, 1, 0);
  const basis   = new THREE.Matrix3();

  function updateCamera(dt, autoOrbit) {
    if (autoOrbit) orbit.tTheta += dt * 0.052;

    // critically-damped-ish easing
    const k = 1.0 - Math.exp(-dt * 6.5);
    orbit.theta  += (orbit.tTheta  - orbit.theta)  * k;
    orbit.phi    += (orbit.tPhi    - orbit.phi)    * k;
    orbit.radius += (orbit.tRadius - orbit.radius) * k;

    const sp = Math.sin(orbit.phi);
    const cp = Math.cos(orbit.phi);
    const st = Math.sin(orbit.theta);
    const ct = Math.cos(orbit.theta);

    camPos.set(
      orbit.radius * sp * ct,
      orbit.radius * cp,
      orbit.radius * sp * st
    );

    forward.copy(camPos).multiplyScalar(-1).normalize();
    right.crossVectors(forward, worldUp).normalize();
    up.crossVectors(right, forward).normalize();

    // column-major: right | up | forward
    basis.set(
      right.x,   up.x,   forward.x,
      right.y,   up.y,   forward.y,
      right.z,   up.z,   forward.z
    );

    uniforms.uCamPos.value.copy(camPos);
    uniforms.uCamBasis.value.copy(basis);
  }

  /* ============================================================
     6.  INPUT
     ============================================================ */

  let dragging   = false;
  let activeId   = null;
  let lastX = 0, lastY = 0;
  let resumeDelay = 0;   // pause auto-orbit briefly after interaction

  const ROT_SPEED = 0.0055;

  canvas.addEventListener('pointerdown', (e) => {
    if (activeId !== null) return;
    activeId = e.pointerId;
    dragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
    canvas.setPointerCapture(e.pointerId);
    resumeDelay = 1.6;
  });

  canvas.addEventListener('pointermove', (e) => {
    if (!dragging || e.pointerId !== activeId) return;
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    lastX = e.clientX;
    lastY = e.clientY;

    orbit.tTheta -= dx * ROT_SPEED;
    orbit.tPhi   -= dy * ROT_SPEED;
    orbit.tPhi    = Math.min(orbit.maxPhi, Math.max(orbit.minPhi, orbit.tPhi));
    resumeDelay   = 1.6;
  });

  function endDrag(e) {
    if (e.pointerId !== activeId) return;
    dragging = false;
    activeId = null;
    resumeDelay = 1.6;
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const factor = 1 + Math.sign(e.deltaY) * 0.09;
    orbit.tRadius = Math.min(
      orbit.maxRadius,
      Math.max(orbit.minRadius, orbit.tRadius * factor)
    );
    resumeDelay = 1.6;
  }, { passive: false });

  /* ============================================================
     7.  RESIZE
     ============================================================ */

  const drawSize = new THREE.Vector2();

  function resize() {
    const w = stage.clientWidth  || window.innerWidth;
    const h = stage.clientHeight || window.innerHeight;

    const dpr = Math.min(window.devicePixelRatio || 1, 1.5) * quality;

    renderer.setPixelRatio(dpr);
    renderer.setSize(w, h, false);      // CSS size handled by stylesheet

    renderer.getDrawingBufferSize(drawSize);
    composer.setSize(drawSize.x, drawSize.y);
    bloomPass.resolution.set(drawSize.x, drawSize.y);
    uniforms.uResolution.value.set(drawSize.x, drawSize.y);
  }

  window.addEventListener('resize', resize);

  /* ============================================================
     8.  ADAPTIVE QUALITY
     ============================================================ */

  let frames = 0;
  let accum  = 0;
  let cooldown = 2.0;

  function updateQuality(dt) {
    frames++;
    accum += dt;
    cooldown -= dt;

    if (accum < 2.0) return;

    const fps = frames / accum;
    frames = 0;
    accum  = 0;

    if (cooldown > 0) return;

    if (fps < 42 && quality > 0.52) {
      quality = Math.max(0.52, quality - 0.14);
      resize();
      cooldown = 2.5;
    } else if (fps > 58 && quality < 1.0) {
      quality = Math.min(1.0, quality + 0.08);
      resize();
      cooldown = 3.5;
    }
  }

  /* ============================================================
     9.  MAIN LOOP
     ============================================================ */

  let lastT   = performance.now();
  let elapsed = 0;
  let firstFrame = true;

  function loop(now) {
    requestAnimationFrame(loop);

    const dt = Math.min((now - lastT) / 1000, 0.05);
    lastT = now;
    elapsed += dt;

    if (resumeDelay > 0) resumeDelay -= dt;
    const autoOrbit = !dragging && resumeDelay <= 0;

    updateCamera(dt, autoOrbit);
    updateQuality(dt);

    uniforms.uTime.value = elapsed;
    composer.render();

    if (firstFrame) {
      firstFrame = false;
      resize();
      requestAnimationFrame(() => loader.classList.add('hidden'));
    }
  }

  /* ============================================================
     10. BOOT
     ============================================================ */

  resize();
  updateCamera(0.016, false);
  requestAnimationFrame(loop);
  </script>

</body>
</html>
