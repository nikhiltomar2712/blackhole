<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>Gargantua — Black Hole</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #000; overflow: hidden; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
                 Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  #stage { position: fixed; inset: 0; }
  #scene {
    display: block; width: 100%; height: 100%;
    touch-action: none; cursor: grab; outline: none;
  }
  #scene:active { cursor: grabbing; }

  .hud {
    position: fixed;
    left: clamp(18px, 4vw, 52px);
    top: clamp(18px, 5vh, 44px);
    pointer-events: none; user-select: none; z-index: 5;
  }
  .hud .title {
    font-size: clamp(11px, 1.3vw, 14px);
    font-weight: 600; letter-spacing: 0.42em; text-transform: uppercase;
    color: rgba(255, 240, 220, 0.92);
    text-shadow: 0 0 26px rgba(255, 160, 70, 0.35);
  }
  .hud .sub {
    margin-top: 10px;
    font-size: clamp(9px, 0.85vw, 10px);
    letter-spacing: 0.3em; text-transform: uppercase;
    color: rgba(255, 180, 120, 0.48);
  }

  .hint {
    position: fixed; left: 50%; bottom: clamp(18px, 4.5vh, 40px);
    transform: translateX(-50%);
    font-size: 10px; letter-spacing: 0.26em; text-transform: uppercase;
    color: rgba(255, 255, 255, 0.30);
    pointer-events: none; user-select: none; white-space: nowrap; z-index: 5;
    animation: hintPulse 5s ease-in-out infinite;
  }
  @keyframes hintPulse {
    0%, 100% { opacity: 0.32; }
    50%      { opacity: 0.82; }
  }

  .vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 3;
    background: radial-gradient(
      ellipse at 50% 50%,
      rgba(0,0,0,0) 40%,
      rgba(0,0,0,0.35) 76%,
      rgba(0,0,0,0.82) 100%
    );
  }

  #loader {
    position: fixed; inset: 0; z-index: 10;
    display: grid; place-items: center;
    background: #000; color: rgba(255, 200, 150, 0.55);
    font-size: 10px; letter-spacing: 0.34em; text-transform: uppercase;
    transition: opacity 0.9s ease;
  }
  #loader.hidden { opacity: 0; pointer-events: none; }
  @media (prefers-reduced-motion: reduce) { .hint { animation: none; } }
</style>
</head>
<body>

  <div id="stage"><canvas id="scene"></canvas></div>

  <div class="hud">
    <div class="title">Gargantua</div>
    <div class="sub">Schwarzschild&nbsp;·&nbsp;rs = 1</div>
  </div>

  <div class="hint">Drag to orbit&nbsp;&nbsp;·&nbsp;&nbsp;Scroll to zoom</div>

  <div class="vignette"></div>
  <div id="loader">Initializing&nbsp;spacetime…</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
  import * as THREE from 'three';
  import { EffectComposer }   from 'three/addons/postprocessing/EffectComposer.js';
  import { ShaderPass }       from 'three/addons/postprocessing/ShaderPass.js';
  import { UnrealBloomPass }  from 'three/addons/postprocessing/UnrealBloomPass.js';
  import { OutputPass }       from 'three/addons/postprocessing/OutputPass.js';

  /* ============================================================
     SHADERS
     ============================================================ */

  const VERTEX_SHADER = /* glsl */`
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 );
    }
  `;

  const FRAGMENT_SHADER = /* glsl */`
    precision highp float;

    uniform vec2  uResolution;
    uniform float uTime;
    uniform vec3  uCamPos;
    uniform mat3  uCamBasis;
    uniform float uTanHalfFov;

    #define STEPS        260
    #define ESCAPE_R     90.0
    #define HORIZON_R    1.0
    #define PHOTON_R     1.5
    #define DISK_IN      2.25
    #define DISK_OUT     13.0

    /* ---------- noise ---------- */
    vec3 hash33(vec3 p) {
      p = fract(p * vec3(0.1031, 0.1030, 0.0973));
      p += dot(p, p.yxz + 33.33);
      return fract((p.xxy + p.yxx) * p.zyx);
    }
    float hash31(vec3 p) { return hash33(p).x; }
    float hash21(vec2 p) { return hash33(vec3(p, 0.0)).x; }

    float noise2(vec2 x) {
      vec2 i = floor(x), f = fract(x);
      f = f * f * (3.0 - 2.0 * f);
      float a = hash21(i);
      float b = hash21(i + vec2(1.0, 0.0));
      float c = hash21(i + vec2(0.0, 1.0));
      float d = hash21(i + vec2(1.0, 1.0));
      return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
    }
    float fbm2(vec2 p) {
      float s = 0.0, a = 0.5;
      mat2 rot = mat2(0.80, 0.60, -0.60, 0.80) * 1.85;
      for (int i = 0; i < 5; i++) { s += a * noise2(p); p = rot * p; a *= 0.5; }
      return s;
    }
    float fbm2a(vec2 p) {
      float s = 0.0, a = 0.55, norm = 0.0;
      mat2 rot = mat2(0.80, 0.60, -0.60, 0.80) * 2.05;
      for (int i = 0; i < 5; i++) { s += a * noise2(p); norm += a; p = rot * p; a *= 0.55; }
      return s / norm;
    }

    /* ---------- stars ---------- */
    vec3 starLayer(vec3 dir, float scale, float thr, float sz, float bright, vec3 tint) {
      vec3 p  = dir * scale;
      vec3 id = floor(p);
      vec3 f  = fract(p) - 0.5;
      float h = hash31(id);
      if (h < thr) return vec3(0.0);
      vec3 off = vec3(hash31(id + 11.7), hash31(id + 27.3), hash31(id + 51.1)) - 0.5;
      off *= 0.72;
      float d = length(f - off);
      float s = smoothstep(sz, 0.0, d);
      s *= s;
      float tw = 0.78 + 0.22 * sin(uTime * 1.9 + h * 91.0);
      return tint * (s * bright * tw);
    }
    vec3 starfield(vec3 dir) {
      vec3 c = vec3(0.0);
      c += starLayer(dir,  70.0, 0.935, 0.090, 1.15, vec3(1.00, 0.98, 0.95));
      c += starLayer(dir, 140.0, 0.950, 0.075, 0.72, vec3(0.78, 0.88, 1.00));
      c += starLayer(dir, 220.0, 0.958, 0.065, 0.46, vec3(1.00, 0.82, 0.62));
      c += starLayer(dir, 380.0, 0.965, 0.050, 0.28, vec3(0.92, 0.94, 1.00));
      return c;
    }
    vec3 background(vec3 dir) {
      float n  = fbm2(vec2(dir.x, dir.z) * 2.0 + dir.y * 1.7);
      float n2 = fbm2(vec2(dir.y, dir.x) * 4.5 - dir.z * 1.3);
      vec3 haze = mix(vec3(0.0018, 0.0028, 0.0080),
                      vec3(0.0140, 0.0065, 0.0215), n * 0.7 + n2 * 0.3);
      haze *= 0.40 + 0.55 * smoothstep(-0.75, 0.75, dir.y);
      return haze + starfield(dir);
    }

    /* ---------- accretion disk ---------- */

    float relativisticBoost(vec3 pos, vec3 rd, float r) {
      float v = sqrt(0.5 / max(r - 1.0, 0.35));
      v = min(v, 0.86);
      vec3 tang = normalize(cross(vec3(0.0, 1.0, 0.0), pos));
      float beta   = v;
      float gamma  = 1.0 / sqrt(max(1.0 - beta * beta, 1e-4));
      float cosAng = dot(tang, -rd);
      float D      = 1.0 / max(gamma * (1.0 - beta * cosAng), 0.08);
      float grav = sqrt(max(0.0, 1.0 - HORIZON_R / max(r, 1.001)));
      float g = D * grav;
      return pow(max(g, 0.05), 3.2);
    }

    vec3 diskSample(vec3 p, vec3 rd, float r) {
      float phi   = atan(p.z, p.x);
      float omega = 1.60 / (r * sqrt(r));
      float ang   = phi + uTime * omega;
      vec2 q = vec2(cos(ang), sin(ang)) * r;

      float n1 = fbm2a(q * 0.42 + vec2(0.0, uTime * 0.10));
      float n2 = fbm2a(q * 1.15 - vec2(uTime * 0.15, 0.0));
      float n3 = fbm2a(q * 3.20 + vec2(uTime * 0.22, uTime * 0.08));
      float n  = n1 * 0.55 + n2 * 0.30 + n3 * 0.15;

      float armPhase = ang * 2.0 - log(r) * 5.5 + uTime * 0.35;
      float arms     = 0.62 + 0.38 * sin(armPhase);

      float rin  = smoothstep(DISK_IN, DISK_IN + 1.35, r);
      float rout = 1.0 - smoothstep(DISK_OUT * 0.42, DISK_OUT, r);
      float ring = 1.0 + 0.55 * exp(-pow((r - 3.4) * 0.75, 2.0));

      float density = rin * rout * ring * arms * (0.28 + 1.25 * n);
      density = pow(clamp(density, 0.0, 1.6), 1.35);

      float t = clamp((r - DISK_IN) / (DISK_OUT - DISK_IN), 0.0, 1.0);
      vec3 cCore  = vec3(1.00, 0.99, 0.96);
      vec3 cHot   = vec3(1.00, 0.86, 0.55);
      vec3 cMid   = vec3(0.98, 0.50, 0.14);
      vec3 cCool  = vec3(0.60, 0.09, 0.02);

      vec3 col = mix(cCore, cHot, smoothstep(0.00, 0.16, t));
      col      = mix(col,   cMid, smoothstep(0.14, 0.55, t));
      col      = mix(col,   cCool, smoothstep(0.50, 1.00, t));

      float boost = relativisticBoost(p, rd, r);
      float path  = clamp(0.30 / max(abs(rd.y), 0.14), 0.5, 2.4);

      /* reduced emission scale (was 4.2) */
      return col * density * boost * path * 2.1;
    }

    /* ---------- main ---------- */
    void main() {
      vec2 uv = (gl_FragCoord.xy * 2.0 - uResolution) / uResolution.y;
      vec3 rd = normalize(uCamBasis * vec3(uv * uTanHalfFov, 1.0));
      vec3 ro = uCamPos;

      vec3  hv = cross(ro, rd);
      float h2 = dot(hv, hv);
      float hm = sqrt(h2);

      vec3  pos = ro;
      vec3  dir = rd;
      vec3  col = vec3(0.0);
      float trans = 1.0;
      float minR  = 1e9;
      bool  captured = false;

      for (int i = 0; i < STEPS; i++) {
        float r = length(pos);
        minR = min(minR, r);
        if (r < HORIZON_R) { captured = true; break; }
        if (r > ESCAPE_R && dot(pos, dir) > 0.0) break;

        float dt = 0.055 * r * r / (hm + 0.6);
        dt = clamp(dt, 0.010, 3.0);

        float r2 = r * r;
        vec3  acc = -1.5 * h2 * pos / (r2 * r2 * r);

        vec3 npos = pos + dir * dt + 0.5 * acc * dt * dt;
        vec3 ndir = dir + acc * dt;

        if (pos.y * npos.y < 0.0) {
          float f  = pos.y / (pos.y - npos.y);
          vec3  hit = mix(pos, npos, f);
          float rr  = length(hit.xz);
          if (rr > DISK_IN && rr < DISK_OUT) {
            vec3 e = diskSample(hit, normalize(dir), rr);
            col   += trans * e;
            trans *= 1.0 - clamp(dot(e, vec3(0.30)) * 0.55, 0.0, 0.78);
          }
        }
        pos = npos;
        dir = ndir;
        if (trans < 0.015) break;
      }

      vec3 outc = col;
      if (!captured) outc += trans * background(normalize(dir));

      /* softer photon ring (was 0.28) */
      float rq   = (minR - PHOTON_R) * 4.2;
      float ring = exp(-rq * rq);
      outc += vec3(1.00, 0.78, 0.52) * ring * 0.14;

      gl_FragColor = vec4(outc, 1.0);
    }
  `;

  /* ============================================================
     RENDERER
     ============================================================ */

  const stage  = document.getElementById('stage');
  const canvas = document.getElementById('scene');
  const loader = document.getElementById('loader');

  const renderer = new THREE.WebGLRenderer({
    canvas, antialias: false, alpha: false, stencil: false,
    powerPreference: 'high-performance'
  });
  renderer.setClearColor(0x000000, 1);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.82;   // <-- reduced from 1.05

  let quality = 1.0;

  /* ============================================================
     UNIFORMS + MATERIAL
     ============================================================ */

  const uniforms = {
    uResolution: { value: new THREE.Vector2(1, 1) },
    uTime:       { value: 0 },
    uCamPos:     { value: new THREE.Vector3(0, 5, 24) },
    uCamBasis:   { value: new THREE.Matrix3() },
    uTanHalfFov: { value: Math.tan(THREE.MathUtils.degToRad(48.0) * 0.5) }
  };

  const rayMaterial = new THREE.ShaderMaterial({
    uniforms, vertexShader: VERTEX_SHADER, fragmentShader: FRAGMENT_SHADER,
    depthTest: false, depthWrite: false, blending: THREE.NoBlending
  });

  /* ============================================================
     POST-PROCESSING  (bloom toned down)
     ============================================================ */

  const composer = new EffectComposer(renderer);
  composer.addPass(new ShaderPass(rayMaterial));

  const bloomPass = new UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    0.42,   // strength  (was 0.92)
    0.58,   // radius
    0.72    // threshold (raised so only the hottest core blooms)
  );
  composer.addPass(bloomPass);
  composer.addPass(new OutputPass());

  /* ============================================================
     CAMERA ORBIT
     ============================================================ */

  const orbit = {
    theta: 0.55,  phi: 1.38,  radius: 24,
    tTheta: 0.55, tPhi: 1.38, tRadius: 24,
    minPhi: 0.22, maxPhi: Math.PI - 0.22,
    minRadius: 8.5, maxRadius: 65
  };

  const camPos  = new THREE.Vector3();
  const forward = new THREE.Vector3();
  const right   = new THREE.Vector3();
  const up      = new THREE.Vector3();
  const worldUp = new THREE.Vector3(0, 1, 0);
  const basis   = new THREE.Matrix3();

  function updateCamera(dt, autoOrbit) {
    if (autoOrbit) orbit.tTheta += dt * 0.045;

    const k = 1.0 - Math.exp(-dt * 7.0);
    orbit.theta  += (orbit.tTheta  - orbit.theta)  * k;
    orbit.phi    += (orbit.tPhi    - orbit.phi)    * k;
    orbit.radius += (orbit.tRadius - orbit.radius) * k;

    const sp = Math.sin(orbit.phi);
    const cp = Math.cos(orbit.phi);
    const st = Math.sin(orbit.theta);
    const ct = Math.cos(orbit.theta);

    camPos.set(orbit.radius * sp * ct, orbit.radius * cp, orbit.radius * sp * st);

    forward.copy(camPos).multiplyScalar(-1).normalize();
    right.crossVectors(forward, worldUp).normalize();
    up.crossVectors(right, forward).normalize();

    basis.set(
      right.x, up.x, forward.x,
      right.y, up.y, forward.y,
      right.z, up.z, forward.z
    );

    uniforms.uCamPos.value.copy(camPos);
    uniforms.uCamBasis.value.copy(basis);
  }

  /* ============================================================
     INPUT
     ============================================================ */

  let dragging = false, activeId = null, lastX = 0, lastY = 0, resumeDelay = 0;
  const ROT_SPEED = 0.0052;

  canvas.addEventListener('pointerdown', (e) => {
    if (activeId !== null) return;
    activeId = e.pointerId; dragging = true;
    lastX = e.clientX; lastY = e.clientY;
    canvas.setPointerCapture(e.pointerId);
    resumeDelay = 1.6;
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!dragging || e.pointerId !== activeId) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    orbit.tTheta -= dx * ROT_SPEED;
    orbit.tPhi   -= dy * ROT_SPEED;
    orbit.tPhi    = Math.min(orbit.maxPhi, Math.max(orbit.minPhi, orbit.tPhi));
    resumeDelay   = 1.6;
  });
  function endDrag(e) {
    if (e.pointerId !== activeId) return;
    dragging = false; activeId = null; resumeDelay = 1.6;
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const factor = 1 + Math.sign(e.deltaY) * 0.09;
    orbit.tRadius = Math.min(orbit.maxRadius,
                    Math.max(orbit.minRadius, orbit.tRadius * factor));
    resumeDelay = 1.6;
  }, { passive: false });

  /* ============================================================
     RESIZE
     ============================================================ */

  const drawSize = new THREE.Vector2();

  function resize() {
    const w = stage.clientWidth  || window.innerWidth;
    const h = stage.clientHeight || window.innerHeight;

    let dpr = Math.min(window.devicePixelRatio || 1, 2.0);
    const pixels = w * h * dpr * dpr;
    const maxPixels = 5.2e6;
    if (pixels > maxPixels) dpr *= Math.sqrt(maxPixels / pixels);
    dpr *= quality;

    renderer.setPixelRatio(dpr);
    renderer.setSize(w, h, false);

    renderer.getDrawingBufferSize(drawSize);
    composer.setSize(drawSize.x, drawSize.y);
    bloomPass.resolution.set(drawSize.x, drawSize.y);
    uniforms.uResolution.value.set(drawSize.x, drawSize.y);
  }

  window.addEventListener('resize', resize);

  /* ============================================================
     ADAPTIVE QUALITY
     ============================================================ */

  let frames = 0, accum = 0, cooldown = 2.5;

  function updateQuality(dt) {
    frames++; accum += dt; cooldown -= dt;
    if (accum < 2.0) return;
    const fps = frames / accum;
    frames = 0; accum = 0;
    if (cooldown > 0) return;
    if (fps < 45 && quality > 0.55) {
      quality = Math.max(0.55, quality - 0.14); resize(); cooldown = 2.6;
    } else if (fps > 58 && quality < 1.0) {
      quality = Math.min(1.0, quality + 0.07); resize(); cooldown = 3.5;
    }
  }

  /* ============================================================
     LOOP
     ============================================================ */

  let lastT = performance.now(), elapsed = 0, firstFrame = true;

  function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.min((now - lastT) / 1000, 0.05);
    lastT = now; elapsed += dt;

    if (resumeDelay > 0) resumeDelay -= dt;
    const autoOrbit = !dragging && resumeDelay <= 0;

    updateCamera(dt, autoOrbit);
    updateQuality(dt);

    uniforms.uTime.value = elapsed;
    composer.render();

    if (firstFrame) {
      firstFrame = false;
      resize();
      requestAnimationFrame(() => loader.classList.add('hidden'));
    }
  }

  /* ============================================================
     BOOT
     ============================================================ */

  resize();
  updateCamera(0.016, false);
  requestAnimationFrame(loop);
  </script>

</body>
</html>
